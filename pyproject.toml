[project]
name = "squad-oaf"
version = "0.1.0"
description = "An Open Agent Format (OAF) harness: parse, validate, resolve, and run OAF agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
runtime = [
    "agno>=1.0",
    "openai>=1.40",
    "ddgs>=9.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
oaf = "oaf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oaf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
